spring.application.name=api-service
server.port=8765

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Enable service discovery for gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Manual route for admin-flight-service
spring.cloud.gateway.routes[0].id=admin-flight-service
spring.cloud.gateway.routes[0].uri=lb://admin-flight-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/admin/**

